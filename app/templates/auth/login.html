{% extends 'base.html' %}

{% block title %}تسجيل الدخول - وثاق{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="وثاق" height="70" class="mb-3">
                        <h2 class="h3">تسجيل الدخول</h2>
                        <p class="text-muted">أدخل بياناتك للوصول إلى منصة وثاق</p>
                    </div>
                    
                    <form method="post" action="{{ url_for('auth.login') }}">
                        {{ form.hidden_tag() }}
                        <div class="mb-3">
                            <label for="email" class="form-label">البريد الإلكتروني</label>
                            <input type="email" class="form-control" id="email" name="email" required autofocus>
                        </div>
                        
                        <div class="mb-3">
                            <label for="password" class="form-label">كلمة المرور</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="remember_me" name="remember_me">
                            <label class="form-check-label" for="remember_me">تذكرني</label>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">تسجيل الدخول</button>
                        </div>
                    </form>
                    
                    <div class="mt-4 text-center">
                        <p><a href="{{ url_for('auth.reset_password_request') }}" class="text-decoration-none">نسيت كلمة المرور؟</a></p>
                        <p class="mb-0">ليس لديك حساب؟ <a href="{{ url_for('auth.register') }}" class="text-decoration-none">سجل الآن</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
